<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Xe Buýt Sài Gòn – Game quản lý xe buýt TP.HCM</title>
<link rel="icon" href="assets/icon.svg">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div id="map"></div>
<div id="tint"></div>
<canvas id="fx"></canvas>
<canvas id="rain"></canvas>

<header id="hud">
  <div class="hud-row">
    <div class="pill money" data-ic="coin" data-s="24"><span id="money">0</span></div>
    <div class="pill clock"><span id="dayicon"></span><span id="clock">06:00</span><small id="daylbl">Ngày 1</small><span id="rush"></span></div>
    <div class="speed">
      <button data-sp="0" aria-label="Tạm dừng" data-ic="pause" data-s="18"></button>
      <button data-sp="1" class="on" aria-label="Tốc độ 1x" data-ic="play" data-s="18"></button>
      <button data-sp="3" aria-label="Tốc độ 3x" data-ic="fast" data-s="18"></button>
    </div>
  </div>
  <div class="hud-row">
    <div class="pill lvl" data-ic="trophy" data-s="24"><b id="lvl">1</b><div class="bar"><i id="xpbar"></i></div></div>
    <button class="pill sat" id="satpill" aria-label="Độ hài lòng"><span id="satface"></span><span id="sat">70%</span></button>
    <div class="pill pax" data-ic="people" data-s="22"><span id="paxnow">0</span></div>
    <button class="pill rb" id="wxbtn" aria-label="Dự báo thời tiết"><span id="wxic"></span></button>
    <button class="pill rb" id="bellbtn" aria-label="Thông báo" data-ic="bell" data-s="24"><span id="belldot" class="dotw"></span></button>
  </div>
  <div id="ticker" role="marquee" aria-label="Tin tức"><b data-ic="news" data-s="18"></b><div class="tk"><span></span></div></div>
  <div id="event" class="hidden"></div>
  <button id="cabgo" class="hidden" data-cab=""><span class="cgi"></span>Vào xe <b id="cabgoid"></b> · Góc nhìn trong xe</button>
</header>

<div class="fab">
  <button id="zin" aria-label="Phóng to" data-ic="plus"></button>
  <button id="zout" aria-label="Thu nhỏ" data-ic="minus"></button>
  <button id="zhome" aria-label="Về tuyến của bạn" data-ic="target" data-s="26"></button>
</div>

<section id="sheet" class="closed"><div class="grab"></div><div id="sheet-body"></div></section>

<nav id="tabs">
  <button data-tab="map" class="on" data-ic="map" data-s="28">Bản đồ</button>
  <button data-tab="routes" data-ic="stop" data-s="28">Tuyến</button>
  <button data-tab="fleet" data-ic="bus" data-s="28">Đội xe<span id="fleetdot" class="tdot"></span></button>
  <button data-tab="finance" data-ic="chart" data-s="28">Tài chính</button>
  <button data-tab="more" data-ic="gear" data-s="28">Thêm<span id="moredot" class="tdot"></span></button>
</nav>

<div id="cab" class="hidden"></div>
<div id="toasts"></div>
<div id="modal" class="hidden"></div>
<div id="loading"><div class="logo"><img src="assets/icon.svg" width="96" height="96" alt=""></div><h1>Xe Buýt Sài Gòn</h1><p>Đang tải bản đồ và tuyến thật…</p></div>
<script src="vendor/maplibre-gl.js"></script>
<script src="js/icons.js?v=4"></script>
<script src="js/config.js?v=4"></script>
<script src="js/game.js?v=4"></script>
</body>
</html>
